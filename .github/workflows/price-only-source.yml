name: Price-only source contract (offline + typecheck)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  price-service-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository contains only approved price service
        run: python -m unittest discover -s tests/price -p 'test_repository_scope.py' -v
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check price-only workers
        run: |
          deno check supabase/functions/price-market-refresh-v1/index.ts
          deno check supabase/functions/price-sheet-sync-v1/index.ts
