  expected_return_curve: continuous_confidence_adjusted
  expected_return_base_weight: 0.60
  expected_return_probability_weighted_weight: 0.40
  historical_return_can_substitute_expected_return: false

quality_hardening_v1:
  policy_version_id: POL-QUALITY-HARDENING-V1
  status: ACTIVE
  promotion_requires_all_gates_pass: true
  gates:
    - BUSINESS_DURABILITY
    - OWNER_EARNINGS
    - VALUE_TRAP
    - VALUATION_ROBUSTNESS
  confidence_map:
    PASS: 1.00
    REVIEW: 0.70
    BLOCKED: 0.40
    FAIL: 0.00
  valuation_confidence_method: mean_four_gate_factors
  durability_anchor_min_years: 3
  owner_earnings:
    sbc_clean_pass_max: 0.10
    sbc_reconciliation_required_above: 0.10
    sbc_hard_review_above: 0.20
    sbc_fail_above: 0.30
  extreme_mispricing_trigger: 0.75
  counter_thesis_evidence_min: 2
  bear_case_review_below: -0.30
  bear_case_fail_below: -0.50
  long_horizon_price_weakness_role: review_trigger_only
  missing_critical_evidence: BLOCKED
  regressions: "20/20 PASS"

expected_return_v3:
  continuous_upside_score: "clamp(50 + 100 * upside, 0, 100)"
  formula: "(0.60 * base_upside_score + 0.40 * probability_weighted_upside_score) * valuation_confidence"
  no_step_function_at_30pct: true
  confidence_required: true

policy_governance:
  registry_table: fwios.policy_registry
  version_table: fwios.policy_versions
  regression_table: fwios.decision_policy_regression_runs
