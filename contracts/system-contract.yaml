contract:
  id: ASSET-PRICE-CONTRACT-1.1.0
  document_version: "1.1.0"
  title: Asset Price Data Service
  date: "2026-10-30"
  timezone: Asia/Bangkok
  status: us_stock_eod_deployed_scheduled_provider_rate_limit
  auto_trade: false
objective:
  purpose: collect_validate_store_and_sync_held_asset_prices
  only_supported_features: [crypto_prices_usd, us_stock_unadjusted_eod_usd, usd_thb_fx, market_observation_storage, google_sheet_price_sync]
  no_future_roadmap: true
authority:
  crypto_stock_fx_prices: Supabase fwios.market_observations
  holdings_transactions_cost_basis_portfolio_calculations: Investment Portfolio Tracker Google Sheet
  code_contract_tests: GitHub
  runtime_state: verify_live_supabase_cron_edge_and_google_sheet
providers:
  crypto:
    name: COINGECKO
    quote_currency: USD
    symbols: [BTC, DOGE, ETH, HBAR, SOL, XRP]
    selection: active_crypto_symbols_from_google_sheet_holdings_read_only
    max_quote_age_hours: 2
  us_stock_eod:
    name: ALPHA_VANTAGE_PRICE
    endpoint: TIME_SERIES_DAILY
    price: "4. close"
    adjustment: unadjusted
    quote_currency: USD
    selection: open_stock_symbols_from_google_sheet_holdings_read_only
    max_symbols: 15
    require_actual_current_us_trading_session: true
    only_post_close: true
    no_weekend_or_stale_backdating: true
    daily_free_requests_planned: 4
    mark_price_only_stock_eod_provenance: true
  fx:
    name: FRANKFURTER_FX
    pair: USD/THB
    max_source_age_days: 5
storage:
  canonical_table: fwios.market_observations
  approved_write_gateway: fwios.ensure_market_observation_v1
  portfolio_table_writes_forbidden: true
  secrets_in_vault_only: true
google_sheet:
  source_tab: Holdings
  source_permission: read_only
  destination_tab: _Market_Data
  destination_consumers: [Price Data, Holdings]
  destination_write_readback_required: true
  historical_unverified_stock_rows_immutable: true
  do_not_modify: [Transactions, Holdings quantities, Cost Basis, Manual Overrides]
workers:
  market_collector:
    edge_function: price-market-refresh-v1
    modes: [CRYPTO, FX, US_STOCK_EOD]
    scheduled_job_ids: [14, 15, 17]
    us_stock_schedule: "19:00 America/New_York Monday-Friday, active Cron 17"
  sheet_price_sync:
    edge_function: price-sheet-sync-v1
    scheduled_job_ids: [16, 18]
    us_stock_followup: "19:30 America/New_York Monday-Friday, active Cron 18"
  require_server_authentication: true
excluded:
  - stock_discovery
  - technical_screening
  - fundamental_research
  - thesis_memory
  - valuation
  - scoring_and_decision
  - opportunity_ranking
  - portfolio_backend_and_mtm
  - portfolio_accounting_mutations
  - trading_execution
  - future_roadmap
legacy_runtime_notice:
  archive_tables_remaining: 0
  archive_deleted_no_backup_by_user_instruction: true
  production_price_tables: 3
  production_price_functions: 6
  price_identity_reduced_to_three_tables: true
  retired_identity_tables: [asset_entities, instrument_identifiers]
  preserved_entity_metadata_count: 10
  retained_current_instrument_uuids_preserved: true
  retained_current_asset_price_history_preserved: true
  post_identity_cleanup_sql_assertions_passed: 36
  post_identity_cleanup_crypto_fx_sheet_e2e: pass
  retired_legacy_edge_deployments_still_present: 0
  active_price_edge_functions: [price-market-refresh-v1, price-sheet-sync-v1]
  active_cron_ids: [14,15,16,17,18]
  us_stock_extension_production_activation: scheduled_first_eod_success_pending
  stock_provider_dry_run: ALPHA_VANTAGE_DAILY_RATE_LIMIT
  stock_data_written: false
  post_deploy_sheet_readback: pass
  sql_regression_passed: 44
  held_instrument_count: 10
  open_stock_symbols: [MSFT, NVDA, TLN, TTWO]
  open_crypto_symbols: [BTC, DOGE, ETH, HBAR, SOL, XRP]
  user_authorized_permanent_unheld_stock_purge: true
  unheld_stocks_deleted: 60
  unheld_stock_price_observations_deleted: 1789
  observations_after_purge_before_e2e: 18652
  post_purge_crypto_fx_sheet_e2e: pass
  read_current_status: docs/CURRENT_STATUS.md
proposed_extension_not_yet_active:
  pull_request: 112
  rollout_state: draft_pending_live_twelve_data_validation
  provider_fallback:
    provider: TWELVE_DATA
    endpoint: time_series
    interval: 1day
    adjustment: none
    currency: USD
    scheduled_fallback: next_ny_business_day_01_15_et
    source_session: prior_ny_business_day
    must_validate_all_held_stocks_before_atomic_insert: true
    must_preserve_source_provenance: true
  quota_control:
    schema: fwios_quota
    table: api_call_ledger
    separate_from_three_canonical_price_tables: true
    atomic_reservation_before_request: true
    unique_batch_per_provider_session: true
    allow_cancel_only_undispatched_requests: true
    window: conservative_rolling_24_hours
    provider_reported_remaining_is_not_inferred: true
  required_before_activation:
    - github_contract_tests_and_deno_check_pass
    - supabase_quota_transactional_tests_pass
    - no_write_live_twelve_data_entitlement_check
    - verify_correct_market_session_and_unadjusted_close
    - preserve_all_four_stock_atomic_write_contract
    - verify_sheet_provenance_and_price_readback
    - prove_cron_dry_run_has_zero_provider_requests
    - verify_no_portfolio_accounting_writes
  no_legacy_worker_resurrection: true
  no_unheld_stock_writes: true
  auto_trade: false
